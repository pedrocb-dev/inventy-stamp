# =====================================================================
# Inventy Stamp App - arquivo de configuração (MODELO)
#
# Copie este arquivo para "config.properties" na mesma pasta e ajuste
# os valores. O config.properties NÃO vai para o Git (.gitignore), para
# que senhas e endereços reais nunca fiquem no repositório.
#
# Onde o aplicativo procura o config.properties:
#  - na pasta em que o aplicativo é iniciado (no desenvolvimento, a raiz
#    do projeto; nas estações da loja, a pasta do inventy-stamp.jar);
#  - ou no caminho indicado com -Dinventy.config=/caminho/config.properties
#
# Os valores abaixo correspondem ao banco de DEMONSTRAÇÃO criado pelos
# scripts da pasta database/ (veja o README).
# =====================================================================

# --- Banco de dados principal ---------------------------------------
db.url=jdbc:mysql://localhost:3306/inventy_stamp_demo?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
db.usuario=inventy_demo
db.senha=demo1234

# --- Banco alternativo (opcional) ------------------------------------
# Usado quando o banco principal não responde em db.timeout.segundos.
# Útil no desenvolvimento: o principal aponta para o servidor da loja e
# o alternativo para uma base de testes local. Deixe comentado se não usar.
#db.alternativo.url=jdbc:mysql://localhost:3306/inventy_stamp_teste?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
#db.alternativo.usuario=
#db.alternativo.senha=
#db.timeout.segundos=2

# --- Senha da área de Estatísticas -------------------------------------
estatisticas.senha=demo
